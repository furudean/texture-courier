[project]
name = "texture-courier"
version = "0.0.13"
authors = [{ name = "meri", email = "meri@himawari.fun" }]
description = "rips texture cache from second life viewers"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "MIT"
dependencies = []

[project.optional-dependencies]
# to enable live updates - bigger dependency
watcher = ["watchdog>=6"]
# everything the command line program can do
cli = ["texture-courier[watcher]", "tqdm>=4"]

[dependency-groups]
dev = [
  "ruff>=0.16.3",
  "mypy>=1",
  "pytest>=8",
  "hypothesis>=6",
  "types-setuptools",
  "types-tqdm>=4",
]

[tool.setuptools.package-data]
texture_courier = ["py.typed"]

[project.urls]
Homepage = "https://github.com/furudean/texture-courier"
Issues = "https://github.com/furudean/texture-courier/issues"

[build-system]
requires = ["setuptools", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project.scripts]
texture-courier = "texture_courier.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
exclude = ["build", "dist"]
strict = true
untyped_calls_exclude = ["watchdog"]

[tool.ruff]
target-version = "py311"
line-length = 120
